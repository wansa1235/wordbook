<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}

<body>
<title>Vocabulary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: 辭典內頁——單欄、細線分隔詞條，不用卡片底色；一種墨色＋一個群青重點色 */
:root {
  --paper: #f5f5f3;
  --sheet: #ffffff;
  --ink: #17171a;
  --ink-2: #3b3c42;
  --muted: #74757d;
  --rule: #dadad6;
  --accent: #2f45c6;
  --good: #1f6b45;
  --bad: #b4321f;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, "Noto Serif TC", serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121214; --sheet: #1a1a1d; --ink: #ececea; --ink-2: #c9c9c6; --muted: #9597a0; --rule: #2c2c30;
  --accent: #93a2ff; --good: #82cfa2; --bad: #f09a89; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #121214; --sheet: #1a1a1d; --ink: #ececea; --ink-2: #c9c9c6; --muted: #9597a0; --rule: #2c2c30;
  --accent: #93a2ff; --good: #82cfa2; --bad: #f09a89; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
::selection { background: var(--accent); color: var(--paper); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 44px 88px; display: grid; gap: 28px; }

/* 刊頭 */
header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; padding-bottom: 14px; border-bottom: 1.5px solid var(--ink); }
h1 { font-family: var(--serif); font-weight: 400; font-size: 2.75rem; line-height: 1; margin: 0; letter-spacing: -0.025em; font-optical-sizing: auto; }
.stats { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.headtools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

/* 按鈕 */
button { font: inherit; cursor: pointer; color: inherit; }
.btn { border: 1px solid var(--ink); border-radius: 2px; padding: 0 18px; background: var(--ink); color: var(--paper); font-weight: 500; font-size: .9rem; letter-spacing: .02em; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { padding: 7px 14px; font-size: .82rem; }
#quizBtn { background: transparent; color: var(--ink); }
#quizBtn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ghost { background: none; border: 0; color: var(--muted); padding: 2px 0; font-size: .8rem; letter-spacing: .01em; text-underline-offset: 4px; }
.ghost:hover { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; }
.ghost.del:hover, .ghost.danger { color: var(--bad); }
.ghost.danger { text-decoration: underline; }

/* 輸入列 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 4px 8px; display: grid; gap: 14px; }
.add { display: flex; gap: 14px; align-items: stretch; }
.add input { flex: 1; min-width: 0; font: 400 1.35rem var(--serif); padding: 10px 2px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; color: var(--ink); transition: border-color .15s; }
.add input::placeholder { font-family: var(--sans); font-size: 1rem; color: var(--muted); }
.add input:focus { outline: none; border-bottom-color: var(--ink); }
/* 檢視切換列 */
.views { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: -10px; }
.deckctl { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.deckctl button { width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 2px; background: none; color: var(--ink); font-size: .95rem; line-height: 1; }
.deckctl button:hover:not(:disabled) { border-color: var(--ink); }
.deckctl button:disabled { opacity: .3; cursor: default; }

/* 卡片模式：一張一張，後面疊兩層表示還有下一張 */
.list.deckmode { border-bottom: 0; }
.stage { position: relative; touch-action: pan-y; padding-bottom: 14px; }
.stage.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
.stage.stacked::before, .stage.stacked::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 14px; border: 1px solid var(--rule); background: var(--sheet); }
.stage.stacked::before { transform: translateY(7px) scale(.975); opacity: .8; }
.stage.stacked::after { transform: translateY(14px) scale(.95); opacity: .5; z-index: -1; }
.stage { isolation: isolate; }
.stage .card { position: relative; z-index: 1; background: var(--sheet); border: 1px solid var(--rule); padding: 28px 24px 24px; min-height: 300px; align-content: start; box-shadow: 0 22px 40px -30px rgba(20, 20, 30, .45); will-change: transform; }
.swipehint { margin: 6px 0 0; text-align: center; font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; color: var(--muted); }
@media (hover: hover) and (pointer: fine) { .swipehint { visibility: hidden; } }

/* A–Z 單字表 */
.list.azmode { border-bottom: 0; }
.azbar { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.azbar button { background: none; border: 0; padding: 7px 0; font-family: var(--mono); font-size: .78rem; color: var(--ink); }
.azbar button:hover:not(:disabled) { color: var(--accent); }
.azbar button:disabled { color: var(--rule); cursor: default; }
.azgroup { scroll-margin-top: 12px; }
.azgroup h3 { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 2px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); font-family: var(--serif); font-weight: 400; font-size: 1.7rem; line-height: 1; }
.azgroup h3 small { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; color: var(--muted); }
.azrow { display: grid; grid-template-columns: minmax(0, 11em) 4.5em minmax(0, 1fr); gap: 2px 14px; align-items: baseline; padding: 9px 0; border-bottom: 1px dotted var(--rule); cursor: pointer; }
.azrow:hover { background: var(--sheet); }
.azrow.mastered { opacity: .45; }
.azrow .say { font-size: 1.1rem; font-weight: 400; letter-spacing: 0; }
.azrow .pos { font-family: var(--serif); font-style: italic; font-size: .92rem; color: var(--muted); }
.azrow .zh2 { font-size: .9rem; color: var(--ink-2); overflow-wrap: anywhere; }

/* 建議字：放在輸入框下方、跟著版面往下推，不蓋住正在打的字 */
.suggest { display: grid; grid-template-columns: minmax(0, 1fr); margin-top: -8px; border-bottom: 1px solid var(--rule); }
.suggest button { display: flex; align-items: baseline; gap: 14px; width: 100%; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 2px; color: var(--ink); }
.suggest button + button { border-top: 1px dotted var(--rule); }
.suggest b { font-family: var(--serif); font-weight: 400; font-size: 1.05rem; flex: none; }
.suggest span { color: var(--muted); font-size: .82rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest button:hover, .suggest button[aria-selected="true"] { background: var(--sheet); }
.tools { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; }
.tools input { flex: 1; min-width: 140px; font: inherit; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; color: var(--ink); }
.tools input:focus { outline: none; border-bottom-color: var(--ink); }
.seg { display: inline-flex; gap: 14px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 4px 0; font-size: .85rem; border-bottom: 1px solid transparent; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tools .ghost { font-size: .85rem; }
.tools { justify-content: space-between; }
.toolr { display: flex; align-items: center; gap: 18px; }
.acc { font-family: var(--mono); font-size: .74rem !important; letter-spacing: .06em; }
.acc span { color: var(--muted); }
.acc span.on { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.acc:hover { text-decoration: none; }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
.note.warn { color: var(--bad); }
.conn { display: inline-flex; align-items: center; gap: 7px; margin: 0; font-size: .8rem; font-weight: 500; justify-self: start; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.conn.on { color: var(--good); }
.conn.off { color: var(--bad); }

/* 詞條 */
.list { display: grid; gap: 0; border-bottom: 1px solid var(--rule); }
.card { border-top: 1px solid var(--rule); padding: 26px 0 24px; display: grid; gap: 10px; min-width: 0; }
.card.mastered { opacity: .45; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.headword { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
.say { background: none; border: 0; padding: 0; color: var(--ink); font-family: var(--serif); font-size: 2.1rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.015em; text-align: left; display: inline-flex; align-items: center; gap: 9px; border-radius: 0; }
.say svg { width: .42em; height: .42em; color: var(--accent); flex: none; opacity: .75; transition: opacity .15s; }
.say:hover svg, .say.speaking svg { opacity: 1; }
.say.speaking { color: var(--accent); }
.say:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; }
.ipa { font-family: var(--serif); font-size: 1rem; color: var(--muted); }
.chip { display: inline-block; font-family: var(--serif); font-style: italic; font-size: 1rem; color: var(--ink-2); background: none; padding: 0; }
.chip.tag { font-family: var(--mono); font-style: normal; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule); padding: 1px 6px 0; vertical-align: 3px; }
.zh { font-size: 1.02rem; line-height: 1.75; color: var(--ink-2); margin: 0; max-width: 60ch; }
.ex { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--ink); max-width: 60ch; }
.ex span { display: block; font-family: var(--sans); font-style: normal; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.actions { display: flex; gap: 16px; flex-wrap: wrap; }

.family { margin-top: 6px; padding-top: 12px; border-top: 1px dotted var(--rule); display: grid; gap: 0; }
.family h3, .miss h3 { margin: 0 0 6px; font-family: var(--mono); font-size: .64rem; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.frow { display: grid; grid-template-columns: minmax(0, 13em) 1fr auto; gap: 2px 16px; align-items: baseline; padding: 6px 0; }
.frow .say { font-size: 1.15rem; font-weight: 400; letter-spacing: 0; }
.frow .chip { font-size: .92rem; color: var(--muted); }
.frow .meta { min-width: 0; font-size: .9rem; color: var(--ink-2); }
.frow .meta i { display: block; font-family: var(--serif); color: var(--muted); font-size: .92rem; }
.frow .plus { font-size: .76rem; white-space: nowrap; }
.frow .chip.tag.plus { font-size: .6rem; }
.loading { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.dot { width: 6px; height: 6px; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } * { transition: none !important; } }

.empty { padding: 36px 0; color: var(--muted); border-top: 1px solid var(--rule); max-width: 60ch; line-height: 1.75; }
.empty b { color: var(--ink); font-family: var(--serif); font-weight: 400; font-size: 1.5rem; display: block; margin-bottom: 8px; letter-spacing: -0.01em; }

/* 同步 */
.sync { border: 1px solid var(--rule); padding: 18px 18px 20px; display: grid; gap: 20px; background: transparent; }
.syncstep { display: grid; gap: 10px; min-width: 0; }
.syncstep h3 { margin: 0; font-size: .85rem; font-weight: 500; }
.sync textarea { width: 100%; min-height: 64px; max-height: 140px; font: .8rem var(--mono); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 0; background: var(--sheet); color: var(--ink); resize: vertical; }

/* 測驗 */
.quiz { display: grid; gap: 28px; }
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.qprog { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 14px; }
.track { width: 140px; height: 1px; background: var(--rule); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.qword { display: grid; gap: 10px; justify-items: start; padding-block: 18px 4px; }
.qword .say { font-size: 3.4rem; font-weight: 400; letter-spacing: -0.03em; }
.qform { display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch; }
.qform input { flex: 1; min-width: 0; font: 400 1.15rem var(--sans); padding: 10px 2px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; color: var(--ink); }
.qform input:focus { outline: none; border-bottom-color: var(--ink); }
.qform .btn { padding-block: 10px; }
.verdict { padding: 4px 0; display: grid; gap: 6px; }
.verdict b { font-family: var(--mono); font-weight: 500; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
.verdict.ok b { color: var(--good); }
.verdict.no b { color: var(--bad); }
.verdict p { margin: 0; color: var(--ink); font-size: 1.05rem; }
.verdict small { color: var(--muted); }
.qrow { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; }
#quiz:not([hidden]) ~ .appver { display: none; }
#qBody { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: baseline; gap: 14px; width: 100%; min-width: 0; text-align: left; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 2px; background: var(--sheet); color: var(--ink); font-size: 1rem; line-height: 1.5; transition: border-color .15s, color .15s; }
.opt .key { flex: none; font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; color: var(--muted); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .4; }
.opt.right { border-color: var(--good); color: var(--good); }
.opt.right .key, .opt.wrong .key { color: inherit; }
.opt.wrong { border-color: var(--bad); color: var(--bad); }
.score { font-family: var(--serif); font-size: 4.5rem; font-weight: 400; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-left: 10px; vertical-align: middle; }
.miss { display: grid; gap: 0; border-top: 1px solid var(--rule); padding-top: 14px; }
.miss div { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 5px 0; color: var(--ink-2); }
.miss .say { font-size: 1.15rem; font-weight: 400; }
.sndbtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--rule); border-radius: 2px; background: none; color: var(--ink); }
.sndbtn svg { width: 17px; height: 17px; }
.sndbtn[aria-pressed="false"] { color: var(--muted); }
.sndbtn:hover { border-color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.check input { accent-color: var(--ink); }

/* 防止版面在手機上被撐寬（保留） */
.say { max-width: 100%; overflow-wrap: anywhere; }
.headword > *, .head > *, .frow > * { min-width: 0; max-width: 100%; }
.zh, .note, .meta, .ex { overflow-wrap: anywhere; }
/* iPhone 在輸入框字小於 16px 時會自動放大頁面，之後就得左右滑動 */
input, textarea, select { font-size: max(16px, 1em) !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: hidden; }
/* 單欄 grid 一律用 minmax(0,1fr)，避免任何內容把欄寬撐超過螢幕（Safari 特別容易） */
.wrap, .list, .card, .quiz, .sync, .family, .bar, .miss, .syncstep { grid-template-columns: minmax(0, 1fr); }
.wrap > *, .bar > *, .list > * { min-width: 0; max-width: 100%; }
.add, .tools, .qform, .headtools, .qrow, .qtop { min-width: 0; max-width: 100%; }
.add input, .qform input { width: 0; }
.tools input { flex: 1 1 120px; min-width: 0; width: 0; }
.appver { color: var(--muted); font: .64rem var(--mono); letter-spacing: .08em; text-transform: uppercase; text-align: left; margin: -16px 0 -8px; }

@media (max-width: 520px) {
  .wrap { padding-block: 28px 64px; gap: 22px; }
  .bar { position: static; }
  h1 { font-size: 2.2rem; }
  .say { font-size: 1.85rem; }
  .qword .say { font-size: 2.6rem; }
  .score { font-size: 3.6rem; }
  .frow { grid-template-columns: minmax(0, 1fr) auto; }
  .frow .meta { grid-column: 1 / -1; grid-row: 2; }
  .azrow { grid-template-columns: minmax(0, 1fr) auto; }
  .azrow .zh2 { grid-column: 1 / -1; }
  .stage .card { padding: 24px 18px 20px; min-height: 260px; }
  .seg { gap: 12px; }
  .tools { gap: 10px 18px; }
}
</style>

<div class="wrap">
  <header>
    <h1>Vocabulary</h1>
    <div class="headtools">
      <div class="stats" id="stats"></div>
      <button class="btn small" id="quizBtn" type="button" hidden>Quiz</button>
    </div>
  </header>

  <section class="quiz" id="quiz" hidden aria-live="polite">
    <div class="qtop">
      <div class="qprog" id="qProg"></div>
      <div class="qrow">
        <button class="sndbtn" id="autoSay" type="button" aria-pressed="true" aria-label="出題時播放聲音" title="出題時播放聲音"></button>
        <button class="ghost" id="qExit" type="button">結束測驗</button>
      </div>
    </div>
    <div id="qBody"></div>
  </section>

  <div class="bar">
    <form class="add" id="addForm" autocomplete="off">
      <input id="newWord" placeholder="輸入英文單字，或用中文搜尋" aria-label="新增單字" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
      <button class="btn" id="addBtn" type="submit">加入</button>
    </form>
    <div class="suggest" id="suggest" role="listbox" aria-label="建議的單字" hidden></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="篩選">
        <button type="button" data-f="all" aria-pressed="true">全部</button>
        <button type="button" data-f="learning" aria-pressed="false">學習中</button>
        <button type="button" data-f="mastered" aria-pressed="false">已熟記</button>
      </div>
      <div class="toolr">
        <button class="ghost acc" id="accentBtn" type="button" title="切換美式／英式發音" aria-label="發音口音"><span data-acc="en-US">US</span> / <span data-acc="en-GB">UK</span></button>
        <button class="ghost" id="syncBtn" type="button" aria-expanded="false" aria-controls="syncPanel">同步</button>
      </div>
    </div>
    <section class="sync" id="syncPanel" hidden>
      <div class="syncstep">
        <h3 id="syncOutTitle">1. 複製這裡的單字</h3>
        <p class="note" id="syncOutHint"></p>
        <div class="qrow"><button class="btn small" id="copyBtn" type="button">複製同步資料</button><span class="note" id="copyMsg" role="status"></span></div>
        <textarea id="exportBox" readonly hidden aria-label="同步資料"></textarea>
      </div>
      <div class="syncstep">
        <h3>2. 貼上另一邊複製的資料</h3>
        <textarea id="importBox" placeholder="在這裡長按 → 貼上" aria-label="貼上同步資料"></textarea>
        <div class="qrow"><button class="btn small" id="importBtn" type="button">合併到這裡</button><span class="note" id="importMsg" role="status"></span></div>
      </div>
    </section>
    <p class="conn" id="conn" hidden></p>
    <p class="note" id="status">正在連線到你的單字庫…</p>
  </div>

  <p class="appver" id="appver" hidden></p>
  <div class="views" id="views" hidden>
    <div class="seg" role="group" aria-label="檢視方式">
      <button type="button" data-view="cards" aria-pressed="true">Cards</button>
      <button type="button" data-view="az" aria-pressed="false">A–Z</button>
    </div>
    <div class="deckctl" id="deckctl">
      <button type="button" id="prevCard" aria-label="上一張">←</button>
      <span id="deckCount"></span>
      <button type="button" id="nextCard" aria-label="下一張">→</button>
    </div>
  </div>
  <div class="list" id="list">
    <div class="empty"><b>單字庫還是空的</b>在上方輸入一個不會的單字，按「加入」。內建字典約 4 萬字（大考、多益、托福、雅思等考試詞彙與常用動詞片語），會直接帶出中文意思、音標和同字族單字，查不到的字才請 Claude 查詢。點任何一個英文字就能聽發音。</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const state = { words: [], filter: "all", q: "", accent: "en-US", pending: new Set(), confirmDel: null, errors: {},
  view: "cards", idx: 0, focusId: null, enterDir: 0 };
try { const v = localStorage.getItem("view"); if (v === "cards" || v === "az") state.view = v; } catch {}
let db = null, sample = null, localMode = false;
// 離線版（GitHub Pages 上的 App）在 <head> 放了這個 meta，不使用 Claude 與雲端資料庫
const OFFLINE = !!document.querySelector('meta[name="wordbook-offline"]');
state.editing = null;

try { const a = localStorage.getItem("accent"); if (a) state.accent = a; } catch {}

/* ---------- 發音 ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch { voices = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang) {
  const list = voices.filter(v => v.lang && v.lang.replace("_", "-").startsWith(lang));
  const pref = ["Samantha", "Google US English", "Daniel", "Google UK English Female", "Serena", "Karen"];
  return list.find(v => pref.some(p => v.name.includes(p))) || list[0] || voices.find(v => v.lang.startsWith("en")) || null;
}
function speak(text, btn) {
  if (!("speechSynthesis" in window)) { setStatus("這個瀏覽器不支援語音朗讀。", true); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.accent; u.rate = 0.9;
  const v = pickVoice(state.accent); if (v) u.voice = v;
  if (btn) { btn.classList.add("speaking"); u.onend = u.onerror = () => btn.classList.remove("speaking"); }
  speechSynthesis.speak(u);
}

/* ---------- 查詢字族 ---------- */
function prompt(word) {
  return `You are an English lexicographer helping a Traditional Chinese (Taiwan) learner.
For the English word "${word}", reply with JSON only, in this exact shape:
{"word": "<the word, corrected spelling, base form>",
 "phonetic": "<US IPA between slashes>",
 "pos": ["<parts of speech of this word, using n. v. adj. adv. prep. conj.>"],
 "zh": "<concise Traditional Chinese meaning(s), Taiwan usage, separate senses with ；>",
 "example": "<one short natural example sentence>",
 "example_zh": "<Traditional Chinese translation>",
 "family": [{"word": "...", "pos": "n.|v.|adj.|adv.", "phonetic": "/.../", "zh": "<Traditional Chinese>", "example": "<short example>"}]}
"family" lists the word family: real, commonly used words built on the same root in OTHER parts of speech or forms (e.g. decide → decision n., decisive adj., decisively adv., indecisive adj.). Do not repeat the headword. Up to 8 items, most useful first. Never invent words; if the word has no common relatives, return an empty array.
If the input is not an English word, return {"error": "<short reason in Traditional Chinese>"}.`;
}
async function lookup(id, word) {
  if (!sample) { state.errors[id] = "目前無法查詢（需要在 Claude 中開啟並允許「詢問 Claude」）。"; render(); return; }
  state.pending.add(id); delete state.errors[id]; render();
  try {
    const r = await sample.json(prompt(word), { modelTier: "default" });
    if (r && r.error) { state.errors[id] = r.error; }
    else if (r && r.word) {
      const fam = Array.isArray(r.family) ? r.family.filter(f => f && f.word).slice(0, 8).map(f => ({
        word: String(f.word), pos: String(f.pos || ""), phonetic: String(f.phonetic || ""), zh: String(f.zh || ""), example: String(f.example || "")
      })) : [];
      await save(id, {
        phonetic: String(r.phonetic || ""), pos: Array.isArray(r.pos) ? r.pos.map(String) : [],
        zh: String(r.zh || ""), example: String(r.example || ""), example_zh: String(r.example_zh || ""),
        family: fam, display: String(r.word), fetchedAt: Date.now(), source: "claude"
      });
    } else state.errors[id] = "查詢結果格式不對，請按「重新查詢」。";
  } catch (e) {
    state.errors[id] = e && e.code === "not_granted" ? "你沒有允許這個頁面詢問 Claude，所以無法查詢字族。"
      : e && e.code === "rate_limited" ? "查詢太頻繁，請稍等一分鐘再按「重新查詢」。"
      : "查詢失敗，請按「重新查詢」。";
  }
  state.pending.delete(id); render();
}

/* ---------- 儲存 ---------- */
const idOf = w => w.toLowerCase().trim().replace(/[^a-z\-' ]/g, "").replace(/\s+/g, "-").replace(/'/g, "");
function localSave() { try { localStorage.setItem("words", JSON.stringify(state.words)); } catch {} }
async function save(id, patch, create, keepTime) {
  if (!keepTime) patch = { ...patch, updatedAt: Date.now() };
  if (localMode) {
    const i = state.words.findIndex(w => w.id === id);
    if (i < 0) state.words.unshift({ id, ...patch }); else state.words[i] = { ...state.words[i], ...patch };
    localSave(); render(); return;
  }
  const ref = db.collection("words").doc(id);
  try { create ? await ref.set(patch) : await ref.update(patch); }
  catch (e) { setStatus("儲存失敗：" + (e && e.message ? e.message : "請稍後再試"), true); }
}
async function remove(id, at) {
  await markDeleted(id, at || Date.now());
  if (localMode) { state.words = state.words.filter(w => w.id !== id); localSave(); render(); return; }
  try { await db.collection("words").doc(id).delete(); } catch { setStatus("刪除失敗，請稍後再試。", true); }
}

/* ---------- 同步（離線版 ⇄ 雲端版，用複製貼上） ---------- */
// 刪除紀錄：讓另一邊同步時也刪掉，而不是把字又加回來
async function getDeleted() {
  if (localMode) { try { return JSON.parse(localStorage.getItem("deleted") || "{}"); } catch { return {}; } }
  try { const s = await db.doc("meta/deleted").get(); return (s.exists && s.data().ids) || {}; } catch { return {}; }
}
async function markDeleted(id, at) {
  const d = await getDeleted();
  if ((d[id] || 0) >= at) return;
  d[id] = at;
  if (localMode) { try { localStorage.setItem("deleted", JSON.stringify(d)); } catch {} return; }
  try { await db.doc("meta/deleted").set({ ids: d }); } catch {}
}
async function exportData() {
  return JSON.stringify({ app: "wordbook", v: 1, from: OFFLINE ? "offline" : "cloud", exportedAt: Date.now(),
    words: state.words.map(({ id, ...rest }) => ({ id, ...rest })), deleted: await getDeleted() });
}
const stamp = w => w.updatedAt || w.createdAt || 0;
async function importData(text) {
  let data;
  try { data = JSON.parse(text.trim()); } catch { return "貼上的內容不是單字庫的同步資料，請重新複製一次。"; }
  if (!data || data.app !== "wordbook" || !Array.isArray(data.words)) return "貼上的內容不是單字庫的同步資料，請重新複製一次。";
  let added = 0, updated = 0, removed = 0;
  const deleted = await getDeleted();
  for (const [id, at] of Object.entries(data.deleted || {})) {
    const local = state.words.find(w => w.id === id);
    if (local && stamp(local) <= at) { await remove(id, at); removed++; }
    else if (!local && (deleted[id] || 0) < at) await markDeleted(id, at);
  }
  for (const w of data.words) {
    if (!w || !w.id || !w.word) continue;
    if ((deleted[w.id] || 0) >= stamp(w)) continue;
    const local = state.words.find(x => x.id === w.id);
    if (local && stamp(local) >= stamp(w)) continue;
    const { id, ...doc } = w;
    await save(id, doc, true, true);
    local ? updated++ : added++;
  }
  render();
  return `同步完成：新增 ${added} 個字、更新 ${updated} 個字、刪除 ${removed} 個字。`;
}
/* ---------- 內建字典（大考中心詞彙表 + 同字族），查得到就不用問 Claude ---------- */
let dict = null;
const DICT_VERSION = 4;  // 字典內容有變就加 1，避免瀏覽器拿到暫存的舊字典
const dictReady = fetch("dict.json?v=" + DICT_VERSION).then(r => r.ok ? r.json() : null).then(d => { dict = d; return d; }).catch(() => null);
function fromDict(word) {
  if (!dict) return null;
  // received 這類本身也是詞條的變化形，優先改用原形 receive
  let lemma = (dict.base && dict.base[word]) || (dict.words[word] ? word : dict.inf[word]);
  if (!lemma && word.includes(" ")) {  // gave up → give up
    const [first, ...rest] = word.split(/\s+/), base = dict.inf[first] && [dict.inf[first], ...rest].join(" ");
    if (base && dict.words[base]) lemma = base;
  }
  const e = lemma && dict.words[lemma];
  if (!e) return null;
  return { lemma, data: {
    display: lemma, phonetic: e.p || "", pos: e.pos || [], zh: e.zh || "", example: "", example_zh: "",
    level: e.lv || null, source: "dict", fetchedAt: Date.now(),
    family: (e.f || []).filter(f => dict.words[f]).map(f => ({ word: f, pos: dict.words[f].fp || "", phonetic: dict.words[f].p || "", zh: dict.words[f].fz || "", example: "" }))
  } };
}
async function addWord(raw) {
  let word = raw.trim().toLowerCase();
  if (!/^[a-z][a-z\-' ]{0,40}$/i.test(word)) { setStatus("請輸入英文單字（可含連字號或空格）。", true); return; }
  await dictReady;
  const hit = fromDict(word);
  const note = hit && hit.lemma !== word ? `（${word} 是 ${hit.lemma} 的變化形，已改用原形）` : "";
  if (hit) word = hit.lemma;
  const id = idOf(word);
  const exists = state.words.find(w => w.id === id);
  if (exists) { setStatus(`「${exists.display || exists.word}」已經在單字庫裡了。${note}`); jumpTo(id); return; }
  state.focusId = id;  // 加入後卡片直接翻到這個字
  if (hit) {
    await save(id, { word, createdAt: Date.now(), mastered: false, ...hit.data }, true);
    setStatus(`已加入「${word}」${note}，資料來自內建字典。`);
    return;
  }
  await save(id, { word, display: word, createdAt: Date.now(), mastered: false, family: [] }, true);
  if (OFFLINE || !sample) {
    state.editing = id; render();
    setStatus(`內建字典沒有「${word}」，請在卡片上自己輸入中文意思${OFFLINE ? "，之後同步到雲端版可以再請 Claude 查詢" : ""}。`);
    const inp = document.getElementById("edit-" + id); if (inp) inp.focus();
    return;
  }
  setStatus(`內建字典沒有「${word}」，改請 Claude 查詢…`);
  lookup(id, word);
}
function jumpTo(id) {
  state.q = ""; state.filter = "all"; state.view = "cards"; state.focusId = id; syncSeg(); render();
  const el = document.getElementById("views");
  if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
}

/* ---------- 畫面 ---------- */
function setStatus(t, warn) { const s = $("#status"); s.textContent = t; s.hidden = !t; s.classList.toggle("warn", !!warn); }
function posClass(p) { p = (p || "").toLowerCase(); return p.startsWith("n") ? "n" : p.startsWith("v") ? "v" : p.startsWith("adj") ? "adj" : p.startsWith("adv") ? "adv" : ""; }
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;  // 沒給值的屬性（例如 disabled: null）不要設
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
function sayBtn(text) {
  const b = el("button", { class: "say", type: "button", title: "點一下聽發音", "aria-label": "朗讀 " + text });
  b.append(text); b.insertAdjacentHTML("beforeend", SPEAKER);
  b.addEventListener("click", () => speak(text, b));
  return b;
}
function card(w) {
  const id = w.id, busy = state.pending.has(id), err = state.errors[id];
  const head = el("div", { class: "headword" },
    sayBtn(w.display || w.word),
    w.phonetic ? el("span", { class: "ipa" }, w.phonetic) : null,
    (w.pos || []).map(p => el("span", { class: "chip " + posClass(p) }, p)),
    w.level ? el("span", { class: "chip tag", title: "大考中心參考詞彙表級別" }, "Level " + w.level) : null,
    w.example_flag ? el("span", { class: "chip tag" }, "範例") : null
  );
  const actions = el("div", { class: "actions" });
  if (state.confirmDel === id) {
    actions.append(
      el("button", { class: "ghost danger", type: "button", onclick: () => { state.confirmDel = null; remove(id); } }, "確定刪除"),
      el("button", { class: "ghost", type: "button", onclick: () => { state.confirmDel = null; render(); } }, "取消"));
  } else {
    actions.append(...[
      el("button", { class: "ghost", type: "button", onclick: () => save(id, { mastered: !w.mastered }) }, w.mastered ? "改回學習中" : "已熟記 ✓"),
      OFFLINE ? null : el("button", { class: "ghost", type: "button", disabled: busy ? "" : null, title: "請 Claude 重新整理意思、例句與相關詞形（會用到 Claude 用量）", onclick: () => lookup(id, w.word) }, w.source === "dict" ? "用 Claude 補例句" : "重新查詢"),
      el("button", { class: "ghost", type: "button", onclick: () => { state.editing = id; render(); const i = document.getElementById("edit-" + id); if (i) i.focus(); } }, "編輯意思"),
      el("button", { class: "ghost del", type: "button", onclick: () => { state.confirmDel = id; render(); } }, "刪除")].filter(Boolean));
  }
  const body = [];
  if (state.editing === id) {
    const form = el("form", { class: "qform", autocomplete: "off" },
      el("input", { id: "edit-" + id, value: w.zh || "", placeholder: "輸入中文意思，多個意思用、分開", "aria-label": "中文意思" }),
      el("button", { class: "btn small", type: "submit" }, "儲存"),
      el("button", { class: "ghost", type: "button", onclick: () => { state.editing = null; render(); } }, "取消"));
    form.addEventListener("submit", e => {
      e.preventDefault(); const v = document.getElementById("edit-" + id).value.trim();
      state.editing = null; save(id, { zh: v, source: w.source === "dict" ? "dict" : "manual" });
    });
    body.push(form);
  } else if (w.zh) body.push(el("p", { class: "zh" }, w.zh));
  else body.push(el("p", { class: "note" }, "還沒有中文意思。按「編輯意思」自己輸入，輸入後才會出現在測驗裡。"));
  if (w.source === "dict" && !w.example && !OFFLINE) body.push(el("p", { class: "note" }, "資料來自內建字典（沒有例句）。想看例句可以按「用 Claude 補例句」。"));
  if (w.example) body.push(el("p", { class: "ex" }, w.example, w.example_zh ? el("span", {}, w.example_zh) : null));
  if (busy) body.push(el("div", { class: "loading" }, el("span", { class: "dot" }), "正在查詢中文意思與相關詞形…"));
  if (err) body.push(el("p", { class: "note warn" }, err));
  const fam = w.family || [];
  if (fam.length) {
    const box = el("div", { class: "family" }, el("h3", {}, "其他詞性 · 同字族"));
    for (const f of fam) {
      const fid = idOf(f.word), inBook = state.words.some(x => x.id === fid);
      box.append(el("div", { class: "frow" },
        el("div", {}, sayBtn(f.word), " ", el("span", { class: "chip " + posClass(f.pos) }, f.pos || "—")),
        el("div", { class: "meta" }, f.zh, f.example ? el("i", {}, f.example) : null),
        inBook ? el("span", { class: "chip tag plus" }, "已收錄")
               : el("button", { class: "ghost plus", type: "button", title: "把這個字也加進單字庫", onclick: () => addWord(f.word) }, "＋ 收錄")
      ));
    }
    body.push(box);
  } else if (!busy && !err && w.fetchedAt) {
    body.push(el("p", { class: "note" }, "這個字沒有常用的其他詞性變化。"));
  }
  return el("article", { class: "card" + (w.mastered ? " mastered" : ""), id: "w-" + id },
    el("div", { class: "head" }, head, actions), body);
}
function render() {
  const list = $("#list");
  const q = state.q.toLowerCase();
  const shown = state.words.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).filter(w =>
    (state.filter === "all" || (state.filter === "mastered") === !!w.mastered) &&
    (!q || [w.word, w.display, w.zh, ...(w.family || []).flatMap(f => [f.word, f.zh])].some(s => (s || "").toLowerCase().includes(q))));
  const m = state.words.filter(w => w.mastered).length;
  $("#stats").textContent = state.words.length ? `${state.words.length} ${state.words.length === 1 ? "word" : "words"} · ${m} mastered` : "";
  const pool = quizPool();
  $("#quizBtn").hidden = !pool.length || quiz.active;
  $("#quizBtn").textContent = `Quiz (${pool.length})`;
  list.replaceChildren();
  $("#views").hidden = !state.words.length || quiz.active;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  $("#deckctl").hidden = state.view !== "cards" || !shown.length;
  list.className = "list " + (state.view === "cards" ? "deckmode" : "azmode");
  if (!state.words.length) {
    list.append(el("div", { class: "empty", html: "<b>單字庫還是空的</b>在上方輸入一個不會的單字，按「加入」。內建字典約 4 萬字（大考、多益、托福、雅思等考試詞彙與常用動詞片語），會直接帶出中文意思、音標和同字族單字，查不到的字才請 Claude 查詢。點任何一個英文字就能聽發音。" }));
  } else if (!shown.length) {
    list.append(el("div", { class: "empty" }, state.q ? `單字庫裡沒有「${state.q}」，按「加入」就能新增。` : "沒有符合條件的單字。"));
  } else if (state.view === "cards") renderDeck(list, shown);
  else renderAZ(list, shown);
}

/* ---------- 卡片：一次一張，往左滑下一張、往右滑上一張 ---------- */
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let deckSize = 0;
function renderDeck(list, shown) {
  if (state.focusId) { const i = shown.findIndex(w => w.id === state.focusId); if (i >= 0) state.idx = i; state.focusId = null; }
  deckSize = shown.length;
  state.idx = Math.max(0, Math.min(state.idx, shown.length - 1));
  $("#deckCount").textContent = `${String(state.idx + 1).padStart(2, "0")} / ${String(shown.length).padStart(2, "0")}`;
  $("#prevCard").disabled = $("#nextCard").disabled = shown.length < 2;
  const c = card(shown[state.idx]);
  const stage = el("div", { class: "stage" + (shown.length > 1 ? " stacked" : "") }, c);
  list.append(stage);
  if (state.enterDir && !reduceMotion()) {
    const d = state.enterDir;
    c.style.transform = `translateX(${d * 28}%)`; c.style.opacity = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      c.style.transition = "transform .22s cubic-bezier(.2,.7,.3,1), opacity .22s"; c.style.transform = ""; c.style.opacity = "";
    }));
  }
  state.enterDir = 0;
  attachSwipe(stage, c);
}
function go(dir) {
  const c = document.querySelector(".stage .card");
  // 循環：最後一張往後回到第一張，第一張往前跳到最後一張
  const next = deckSize ? (state.idx + dir + deckSize) % deckSize : 0;
  if (!c || deckSize < 2) {  // 只有一張：輕輕彈一下
    if (c && !reduceMotion()) {
      c.style.transition = "transform .12s"; c.style.transform = `translateX(${-dir * 14}px)`;
      setTimeout(() => { c.style.transform = ""; }, 120);
    }
    return;
  }
  state.confirmDel = null; state.editing = null;
  if (reduceMotion()) { state.idx = next; render(); return; }
  c.style.transition = "transform .18s ease-in, opacity .18s"; c.style.transform = `translateX(${-dir * 110}%) rotate(${-dir * 4}deg)`; c.style.opacity = "0";
  setTimeout(() => { state.idx = next; state.enterDir = dir; render(); }, 170);
}
function attachSwipe(stage, c) {
  let d = null;
  stage.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest("input, textarea")) return;
    d = { x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId };
  });
  stage.addEventListener("pointermove", e => {
    if (!d) return;
    d.dx = e.clientX - d.x; const dy = e.clientY - d.y;
    if (!d.active) {
      if (Math.abs(d.dx) > 10 && Math.abs(d.dx) > Math.abs(dy) * 1.3) { d.active = true; stage.classList.add("dragging"); try { stage.setPointerCapture(d.id); } catch {} }
      else if (Math.abs(dy) > 12) { d = null; return; }
    }
    if (d.active) { c.style.transition = "none"; c.style.transform = `translateX(${d.dx}px) rotate(${d.dx / 40}deg)`; }
  });
  const end = () => {
    if (!d) return;
    const { active, dx } = d; d = null; stage.classList.remove("dragging");
    if (!active) return;
    // 剛拖完不要觸發卡片上的按鈕
    const block = ev => { ev.stopPropagation(); ev.preventDefault(); };
    stage.addEventListener("click", block, true);
    setTimeout(() => stage.removeEventListener("click", block, true), 60);
    if (dx < -70) go(1);
    else if (dx > 70) go(-1);
    else { c.style.transition = "transform .2s"; c.style.transform = ""; }
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

/* ---------- 單字表：A–Z 分類，只列單字、詞性、中文 ---------- */
const stripPos = zh => (zh || "").replace(/\b(n|v|vt|vi|adj|adv|prep|conj|pron|phr|int|art|aux|num)\.\s*/g, "");
function renderAZ(list, shown) {
  const sorted = shown.slice().sort((a, b) => (a.display || a.word).localeCompare(b.display || b.word, "en", { sensitivity: "base" }));
  const groups = new Map();
  for (const w of sorted) {
    const ch = (w.display || w.word)[0].toUpperCase(), key = /[A-Z]/.test(ch) ? ch : "#";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }
  const bar = el("nav", { class: "azbar", "aria-label": "字母索引" });
  for (const L of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
    const b = el("button", { type: "button", disabled: groups.has(L) ? null : "" }, L);
    b.addEventListener("click", () => { const g = document.getElementById("az-" + L); if (g) g.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); });
    bar.append(b);
  }
  list.append(bar);
  for (const [L, ws] of groups) {
    const g = el("section", { class: "azgroup", id: "az-" + L }, el("h3", {}, L, el("small", {}, String(ws.length))));
    for (const w of ws) {
      const row = el("div", { class: "azrow" + (w.mastered ? " mastered" : ""), title: "點一下看這張卡片" },
        sayBtn(w.display || w.word),
        el("span", { class: "pos" }, (w.pos || []).join(" ")),
        el("span", { class: "zh2" }, stripPos(w.zh) || "—"));
      row.addEventListener("click", e => {
        if (e.target.closest(".say")) return;
        state.view = "cards"; state.focusId = w.id; saveView(); render();
        $("#views").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
      });
      g.append(row);
    }
    list.append(g);
  }
}
function saveView() { try { localStorage.setItem("view", state.view); } catch {} }
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; saveView(); render(); }));
$("#prevCard").addEventListener("click", () => go(-1));
$("#nextCard").addEventListener("click", () => go(1));
document.addEventListener("keydown", e => {
  if (state.view !== "cards" || quiz.active || e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
function syncSeg() {
  document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === state.filter)));
  document.querySelectorAll("#accentBtn [data-acc]").forEach(s => s.classList.toggle("on", s.dataset.acc === state.accent));
}

/* ---------- 測驗 ---------- */
const quiz = { active: false, items: [], i: 0, results: [], phase: "ask", cur: null, autoSay: true };
try { quiz.autoSay = localStorage.getItem("autoSay") !== "0"; } catch {}
const MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>';
function syncSound() {
  const b = $("#autoSay"); b.innerHTML = quiz.autoSay ? SPEAKER : MUTED;
  b.setAttribute("aria-pressed", String(quiz.autoSay));
  b.title = quiz.autoSay ? "出題時播放聲音（點一下關閉）" : "出題時不播放聲音（點一下開啟）";
}
syncSound();
const quizPool = () => state.words.filter(w => !w.mastered && w.zh);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => (s || "").replace(/[\s。．.!！?？~～]/g, "").replace(/[的地得]$/, "");
function senses(zh) { return zh.split(/[；;，,、\/／()（）\[\]［］]/).map(norm).filter(Boolean); }
function startQuiz(words) {
  quiz.items = shuffle(words.map(w => w.id)); quiz.i = 0; quiz.results = []; quiz.active = true;
  speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel();
  $(".bar").hidden = true; $("#list").hidden = true; $("#quiz").hidden = false;
  render(); askNext();
  window.scrollTo(0, 0);
}
function exitQuiz() {
  quiz.active = false; $(".bar").hidden = false; $("#list").hidden = false; $("#quiz").hidden = true; render();
}
const wordById = id => state.words.find(w => w.id === id);
/* 選擇題：正確答案＋3 個干擾選項（先從單字庫挑，不夠再從內建字典補，盡量同詞性） */
const shortZh = zh => stripPos(zh).split(/[；;]/)[0].split(/[、,，]/).map(s => s.trim()).filter(Boolean).slice(0, 3).join("、");
let dictPool = null;
function makeOptions(w) {
  const right = shortZh(w.zh), pos = (w.pos || [])[0] || "";
  const rightSenses = new Set(senses(w.zh));
  const taken = new Set([right]);
  const ok = t => t && !taken.has(t) && !senses(t).some(s => rightSenses.has(s));
  const pick = (cands, n) => {
    const out = [];
    for (const c of shuffle(cands)) { if (out.length >= n) break; if (ok(c.t)) { taken.add(c.t); out.push(c.t); } }
    return out;
  };
  const mine = state.words.filter(x => x.id !== w.id && x.zh).map(x => ({ t: shortZh(x.zh), pos: (x.pos || [])[0] || "" }));
  // 最多 2 個來自自己的單字庫，第 3 個用字典的字，避免選項總是同一批
  const wrong = pick(mine.filter(c => c.pos === pos), 2);
  if (wrong.length < 2) wrong.push(...pick(mine, 2 - wrong.length));
  if (wrong.length < 3 && dict) {
    if (!dictPool) dictPool = Object.values(dict.words).filter(e => e.lv && e.zh).map(e => ({ t: shortZh(e.zh), pos: (e.pos || [])[0] || "" }));
    const sample = [];
    for (let k = 0; k < 60; k++) sample.push(dictPool[Math.floor(Math.random() * dictPool.length)]);
    wrong.push(...pick(sample.filter(c => c.pos === pos), 3 - wrong.length));
    if (wrong.length < 3) wrong.push(...pick(sample, 3 - wrong.length));
  }
  if (wrong.length < 3) wrong.push(...pick(mine, 3 - wrong.length));
  return shuffle([{ t: right, ok: true }, ...wrong.slice(0, 3).map(t => ({ t, ok: false }))]);
}
function askNext() {
  while (quiz.i < quiz.items.length && !wordById(quiz.items[quiz.i])) quiz.i++;
  if (quiz.i >= quiz.items.length) { quiz.phase = "end"; renderQuiz(); return; }
  const w = wordById(quiz.items[quiz.i]);
  quiz.phase = "ask"; quiz.cur = { id: w.id, options: makeOptions(w), chosen: null, correct: null };
  renderQuiz();
  if (quiz.autoSay) speak(w.display || w.word, document.querySelector("#qBody .say"));
}
function choose(i) {
  if (quiz.phase !== "ask") return;
  quiz.cur.chosen = i; quiz.cur.correct = i >= 0 && quiz.cur.options[i].ok;
  quiz.phase = "result"; renderQuiz();
}
document.addEventListener("keydown", e => {
  if (!quiz.active || quiz.phase !== "ask" || e.target.closest("input, textarea")) return;
  const n = Number(e.key); if (n >= 1 && n <= 4 && quiz.cur.options[n - 1]) choose(n - 1);
});
function next() {
  const c = quiz.cur, w = wordById(c.id);
  quiz.results.push(c);
  if (w) save(c.id, c.correct ? { quizRight: (w.quizRight || 0) + 1, lastQuiz: Date.now() } : { quizWrong: (w.quizWrong || 0) + 1, lastQuiz: Date.now() });
  quiz.i++; askNext();
}
function renderQuiz() {
  const total = quiz.items.length, done = quiz.phase === "end" ? total : quiz.i;
  $("#qProg").replaceChildren(
    el("span", {}, quiz.phase === "end" ? `${total} / ${total}` : `${quiz.i + 1} / ${total}`),
    el("span", { class: "track" }, el("i", { style: `width:${total ? done / total * 100 : 0}%` })));
  const body = $("#qBody"); body.replaceChildren();
  if (quiz.phase === "end") {
    const right = quiz.results.filter(r => r.correct).length;
    const wrong = quiz.results.filter(r => !r.correct).map(r => wordById(r.id)).filter(Boolean);
    body.append(el("div", { class: "qword" },
      el("div", { class: "score" }, `${right} / ${quiz.results.length}`, el("small", {}, "答對")),
      el("p", { class: "note" }, wrong.length ? "答錯的字整理在下面，可以馬上再練一次。" : "全部答對！可以到單字庫把熟悉的字標成「已熟記」。")));
    if (wrong.length) {
      const box = el("div", { class: "miss" }, el("h3", {}, "答錯的字"));
      wrong.forEach(w => box.append(el("div", {}, sayBtn(w.display || w.word), el("span", {}, w.zh))));
      body.append(box);
    }
    const row = el("div", { class: "qrow", style: "margin-top:16px" });
    if (wrong.length) row.append(el("button", { class: "btn small", type: "button", onclick: () => startQuiz(wrong) }, `再練錯的 ${wrong.length} 個字`));
    else if (quizPool().length) row.append(el("button", { class: "btn small", type: "button", onclick: () => startQuiz(quizPool()) }, "再測一次"));
    row.append(el("button", { class: "ghost", type: "button", onclick: exitQuiz }, "回到單字庫"));
    body.append(row);
    return;
  }
  const w = wordById(quiz.cur.id);
  body.append(el("div", { class: "qword" },
    sayBtn(w.display || w.word),
    el("div", { class: "qrow" }, w.phonetic ? el("span", { class: "ipa" }, w.phonetic) : null,
      (w.pos || []).map(p => el("span", { class: "chip " + posClass(p) }, p)))));
  const c = quiz.cur, done1 = quiz.phase === "result";
  const opts = el("div", { class: "opts", role: "group", "aria-label": "選擇中文意思" });
  c.options.forEach((o, i) => {
    const cls = "opt" + (done1 && o.ok ? " right" : "") + (done1 && i === c.chosen && !o.ok ? " wrong" : "");
    const b = el("button", { class: cls, type: "button", disabled: done1 ? "" : null, onclick: () => choose(i) },
      el("span", { class: "key" }, "ABCD"[i]), el("span", { class: "txt" }, o.t));
    opts.append(b);
  });
  body.append(opts);
  if (!done1) {
    body.append(el("div", { class: "qrow" }, el("button", { class: "ghost", type: "button", onclick: () => choose(-1) }, "看答案")));
    return;
  }
  body.append(el("div", { class: "verdict " + (c.correct ? "ok" : "no") },
    el("b", {}, c.correct ? "答對了" : (c.chosen >= 0 ? "答錯了" : "記下來")),
    stripPos(w.zh) !== shortZh(w.zh) ? el("p", {}, "完整意思：" + w.zh) : null));
  if (w.example) body.append(el("p", { class: "ex" }, w.example, w.example_zh ? el("span", {}, w.example_zh) : null));
  const nextBtn = el("button", { class: "btn small", type: "button", id: "qNext", onclick: next }, quiz.i + 1 < total ? "下一題" : "看成績");
  const row = el("div", { class: "qrow" }, nextBtn);
  row.append(el("button", { class: "ghost", type: "button", onclick: () => { save(c.id, { mastered: true }); next(); } }, "標為已熟記，下一題"));
  body.append(row);
  nextBtn.focus();
}
$("#quizBtn").addEventListener("click", () => startQuiz(quizPool()));
$("#qExit").addEventListener("click", exitQuiz);
$("#autoSay").addEventListener("click", () => {
  quiz.autoSay = !quiz.autoSay; syncSound();
  try { localStorage.setItem("autoSay", quiz.autoSay ? "1" : "0"); } catch {}
});

/* ---------- 事件 ---------- */
$("#addForm").addEventListener("submit", e => {
  e.preventDefault(); const v = $("#newWord").value; if (!v.trim()) return;
  if (HAN.test(v)) {  // 打中文是搜尋，不是新增
    const first = $("#suggest").firstElementChild;
    if (first) first.click(); else setStatus(`內建字典裡找不到「${v.trim()}」對應的英文單字。`, true);
    return;
  }
  $("#newWord").value = ""; state.q = ""; addWord(v);
});
// 輸入框同時是搜尋框：打字時下面的單字跟著篩選
$("#newWord").addEventListener("input", e => { state.q = e.target.value.trim(); state.idx = 0; render(); });
// 輸入時在下方提示內建字典裡的字（只列開頭相符的前 8 個）
let sugIndex = -1;
const HAN = /[㐀-鿿]/;
function hideSuggest() { const box = $("#suggest"); box.hidden = true; box.replaceChildren(); sugIndex = -1; $("#newWord").setAttribute("aria-expanded", "false"); }
function pickSuggest(k) { hideSuggest(); $("#newWord").value = ""; state.q = ""; addWord(k); }
function markSuggest() { [...$("#suggest").children].forEach((b, i) => b.setAttribute("aria-selected", String(i === sugIndex))); }
$("#newWord").addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) { if (e.key === "Enter") e.preventDefault(); return; }  // 注音／拼音選字中的 Enter 不送出
  const items = $("#suggest").children;
  if ($("#suggest").hidden || !items.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); sugIndex = (sugIndex + 1) % items.length; markSuggest(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sugIndex = (sugIndex - 1 + items.length) % items.length; markSuggest(); }
  else if (e.key === "Escape") hideSuggest();
  else if (e.key === "Enter" && sugIndex >= 0) { e.preventDefault(); items[sugIndex].click(); }
});
$("#newWord").addEventListener("blur", () => setTimeout(hideSuggest, 150));
$("#addForm").addEventListener("submit", hideSuggest);
$("#newWord").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = $("#suggest"), han = HAN.test(q);
  if (!dict || (!han && q.length < 2)) { hideSuggest(); return; }
  // 英文：開頭相符；中文：意思裡有這幾個字（例如打「放棄」找到 abandon）。大考詞彙優先
  const match = han ? (k => dict.words[k].zh.includes(q)) : (k => k.startsWith(q));
  const hits = [], more = [];
  for (const k in dict.words) {
    if (!match(k)) continue;
    if (dict.words[k].lv) { hits.push(k); if (hits.length >= 8) break; } else if (more.length < 8) more.push(k);
  }
  if (han) hits.sort((a, b) => dict.words[a].zh.indexOf(q) - dict.words[b].zh.indexOf(q));
  hits.push(...more.slice(0, 8 - hits.length));
  sugIndex = -1;
  if (!hits.length) { hideSuggest(); return; }
  box.replaceChildren(...hits.map(k => {
    const b = el("button", { type: "button", role: "option", "aria-selected": "false" }, el("b", {}, k), el("span", {}, dict.words[k].zh));
    b.addEventListener("pointerdown", ev => ev.preventDefault());  // 點選時不讓輸入框失去焦點
    b.addEventListener("click", () => pickSuggest(k));
    return b;
  }));
  box.hidden = false; e.target.setAttribute("aria-expanded", "true");
});
document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { state.filter = b.dataset.f; syncSeg(); render(); }));
$("#accentBtn").addEventListener("click", () => {
  state.accent = state.accent === "en-US" ? "en-GB" : "en-US"; syncSeg(); try { localStorage.setItem("accent", state.accent); } catch {}
});
syncSeg();

$("#syncBtn").addEventListener("click", () => {
  const p = $("#syncPanel"); p.hidden = !p.hidden; $("#syncBtn").setAttribute("aria-expanded", String(!p.hidden));
});
$("#syncOutTitle").textContent = OFFLINE ? "1. 複製這支手機上的單字" : "1. 複製雲端的單字";
$("#syncOutHint").textContent = OFFLINE
  ? "按下後到雲端版（claude.ai 的單字庫連結）打開「同步」，貼在第 2 步。"
  : "按下後到 iPhone 上的離線版打開「同步」，貼在第 2 步。";
$("#copyBtn").addEventListener("click", async () => {
  const text = await exportData(), box = $("#exportBox");
  box.value = text;
  try { await navigator.clipboard.writeText(text); $("#copyMsg").textContent = `已複製 ${state.words.length} 個字。`; box.hidden = true; }
  catch { box.hidden = false; box.focus(); box.select(); $("#copyMsg").textContent = "無法自動複製，請長按下面的文字全選後複製。"; }
});
$("#importBtn").addEventListener("click", async () => {
  const t = $("#importBox").value; if (!t.trim()) { $("#importMsg").textContent = "請先貼上另一邊複製的資料。"; return; }
  $("#importMsg").textContent = "合併中…";
  $("#importMsg").textContent = await importData(t);
  $("#importBox").value = "";
});

/* ---------- 啟動 ---------- */
(async () => {
  if (OFFLINE) {
    const ver = document.querySelector('meta[name="wordbook-version"]');
    if (ver) { $("#appver").textContent = "離線版 版本 " + ver.content; $("#appver").hidden = false; }
    startLocal("");
    $("#status").classList.remove("warn");
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    return;
  }
  if (!window.claude || !claude.use) { startLocal("目前不在 Claude 中開啟，單字只會暫存在這個瀏覽器。"); return; }
  const [d, s] = await Promise.all([claude.use("db"), claude.use("sample")]);
  sample = s;
  if (!d) { startLocal("無法連到雲端單字庫（可能未登入），單字暫存在這個瀏覽器。"); return; }
  db = d;
  db.collection("words").orderBy("createdAt", "desc").onSnapshot(snap => {
    state.words = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    setConn(true);
    if ($("#status").textContent.startsWith("正在連線")) setStatus(sample ? "" : "目前無法詢問 Claude，字典沒有的字需要自己輸入意思。", !sample);
    render();
  }, () => { setConn(false); setStatus("單字庫連線中斷，請重新整理頁面。", true); });
})();
function setConn(on) {
  const c = $("#conn"); c.hidden = false;
  c.textContent = on ? "已連線" : "未連線"; c.className = "conn " + (on ? "on" : "off");
}
function startLocal(msg) {
  if (!OFFLINE) setConn(false);
  localMode = true;
  try { state.words = JSON.parse(localStorage.getItem("words") || "[]"); } catch { state.words = []; }
  setStatus(msg, true); render();
}
</script>
